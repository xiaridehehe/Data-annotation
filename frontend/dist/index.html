<body><div id="root"><div id="startup">正在启动标注平台…</div></div>
<script>
function startupError(message) {
 const node = document.getElementById('startup');
 if(node) node.textContent = '平台启动失败：\n' + message;
 console.error(message);
}
window.addEventListener('error', event => startupError(event.message || '资源加载失败'));
window.addEventListener('unhandledrejection', event => startupError(event.reason?.message || String(event.reason)));
</script>
</body></html>
